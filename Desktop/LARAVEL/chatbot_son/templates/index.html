<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_name }} — Asistan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.12);
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 820px;
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      padding: 16px 22px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .avatar {
      width: 42px; height: 42px;
      background: rgba(255,255,255,.18);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .header-info h2 { font-size: .95rem; font-weight: 700; }
    .header-info p  { font-size: .72rem; opacity: .8; }
    .status-dot {
      width: 7px; height: 7px;
      background: #4ade80; border-radius: 50%;
      display: inline-block; margin-right: 4px;
    }

    /* ── Mesajlar ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeUp .22s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(6px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .message.user { align-self: flex-end; }
    .message.bot  { align-self: flex-start; }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .message.user .msg-row { flex-direction: row-reverse; }

    .message-icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0; margin-top: 2px;
    }
    .message.bot  .message-icon { background: #eff6ff; }
    .message.user .message-icon { background: #1e3a8a; color: #fff; }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      font-size: .875rem;
      line-height: 1.6;
    }
    .message.bot  .bubble {
      background: #f1f5f9; color: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .message.user .bubble {
      background: #2563eb; color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* ── Kaynaklar ── */
    .sources {
      margin-top: 7px;
      margin-left: 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .source-chip {
      font-size: .7rem;
      padding: 3px 10px;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 99px;
      text-decoration: none;
      border: 1px solid #bae6fd;
      transition: background .15s;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .source-chip:hover { background: #bae6fd; }

    /* ── Typing ── */
    .typing .bubble {
      display: flex; gap: 5px; align-items: center;
    }
    .dot {
      width: 6px; height: 6px; background: #94a3b8;
      border-radius: 50%; animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce {
      0%,80%,100% { transform:translateY(0); }
      40%          { transform:translateY(-5px); }
    }

    /* ── Input ── */
    .chat-input-area {
      padding: 14px 18px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: #fff;
      flex-shrink: 0;
    }
    #userInput {
      flex: 1;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 11px 15px;
      font-size: .875rem;
      resize: none;
      max-height: 110px;
      outline: none;
      transition: border .2s;
      font-family: inherit;
    }
    #userInput:focus { border-color: #2563eb; }

    #sendBtn {
      width: 44px; height: 44px;
      border: none; border-radius: 12px;
      background: #2563eb; color: #fff;
      cursor: pointer; font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
    }
    #sendBtn:hover   { background: #1d4ed8; }
    #sendBtn:active  { transform: scale(.95); }
    #sendBtn:disabled{ background: #94a3b8; cursor: not-allowed; }

    .chat-footer {
      text-align: center; padding: 6px 0 8px;
      flex-shrink: 0;
    }
    .reset-btn {
      background: none; border: none;
      color: #94a3b8; font-size: 11px;
      cursor: pointer; padding: 4px 10px;
      border-radius: 8px; transition: color .2s;
    }
    .reset-btn:hover { color: #ef4444; }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

    @media (max-width: 480px) {
      body { padding: 0; align-items: flex-end; background: #fff; }
      .chat-container {
        border-radius: 20px 20px 0 0;
        height: 100dvh; max-height: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
<div class="chat-container">

  <div class="chat-header">
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h2>{{ site_name }} Asistanı</h2>
      <p><span class="status-dot"></span>Çevrimiçi · Site içeriğine dayalı yanıtlar</p>
    </div>
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">
      <div class="msg-row">
        <div class="message-icon">🤖</div>
        <div class="bubble">
          Merhaba! Ben <strong>{{ site_name }}</strong> asistanıyım.
          Size nasıl yardımcı olabilirim?
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea id="userInput" rows="1"
      placeholder="Sorunuzu yazın…" maxlength="600"></textarea>
    <button id="sendBtn" title="Gönder">➤</button>
  </div>

  <div class="chat-footer">
    <button class="reset-btn" onclick="resetChat()">🗑 Sohbeti sıfırla</button>
  </div>

</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("userInput");
  const sendBtn    = document.getElementById("sendBtn");

  // Textarea otomatik büyüsün
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });

  // Enter gönder, Shift+Enter satır atla
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener("click", sendMessage);

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");
  }

  function addMessage(role, text, sources = []) {
    const wrap = document.createElement("div");
    wrap.className = `message ${role}`;

    const icon = role === "bot" ? "🤖" : "👤";

    let sourcesHtml = "";
    if (role === "bot" && sources.length > 0) {
      const chips = sources.map(s =>
        `<a class="source-chip" href="${s.url}" target="_blank"
            title="Alaka skoru: ${Math.round(s.score * 100)}%">
          📄 ${escapeHtml(s.title.slice(0, 35))}
        </a>`
      ).join("");
      sourcesHtml = `<div class="sources">${chips}</div>`;
    }

    wrap.innerHTML = `
      <div class="msg-row">
        <div class="message-icon">${icon}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>
      ${sourcesHtml}`;

    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const w = document.createElement("div");
    w.className = "message bot typing";
    w.id = "typing";
    w.innerHTML = `
      <div class="msg-row">
        <div class="message-icon">🤖</div>
        <div class="bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>`;
    messagesEl.appendChild(w);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    addMessage("user", text);
    showTyping();

    try {
      const res  = await fetch("/chat", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTyping();
      addMessage("bot", data.reply || data.error || "Bir hata oluştu.", data.sources || []);
    } catch {
      removeTyping();
      addMessage("bot", "Bağlantı hatası. Lütfen tekrar deneyin.");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  async function resetChat() {
    await fetch("/reset", { method: "POST" });
    messagesEl.innerHTML = `
      <div class="message bot">
        <div class="msg-row">
          <div class="message-icon">🤖</div>
          <div class="bubble">Sohbet sıfırlandı. Size nasıl yardımcı olabilirim?</div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
