# docs/apache-vhost.conf
# KURULUM (Debian/Ubuntu, Apache 2.4 + mod_php). Sırayla çalıştır:
#   1) sudo a2enmod rewrite headers expires deflate
#   2) sudo cp /home/osman/Desktop/eticaret/docs/apache-vhost.conf /etc/apache2/sites-available/eticaret.local.conf
#   3) sudo a2ensite eticaret.local
#   4) echo "127.0.0.1 eticaret.local" | sudo tee -a /etc/hosts
#   5) sudo systemctl reload apache2
#   6) www-data erişimi (ev ve Desktop'ta yalnızca geçiş izni 'x', proje klasöründe okuma+geçiş 'rX'):
#        sudo setfacl -m u:www-data:x /home/osman /home/osman/Desktop
#        sudo setfacl -R -m u:www-data:rX /home/osman/Desktop/eticaret
#   7) Yazma izni (storage ve public/uploads) + yeni dosyalar için default ACL:
#        sudo setfacl -R -m u:www-data:rwX /home/osman/Desktop/eticaret/storage /home/osman/Desktop/eticaret/public/uploads
#        sudo setfacl -R -d -m u:www-data:rwX /home/osman/Desktop/eticaret/storage /home/osman/Desktop/eticaret/public/uploads
#   8) Kontrol: curl -I http://eticaret.local

<VirtualHost *:80>
    ServerName eticaret.local

    # Yalnızca public/ dışarı açılır; .env, storage, scripts web'den görünmez
    DocumentRoot /home/osman/Desktop/eticaret/public

    <Directory /home/osman/Desktop/eticaret/public>
        # Dizin listeleme kapalı; .htaccess (rewrite) için AllowOverride All
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proje kökünün geri kalanı (public hariç, daha özel blok kazanır) varsayılan olarak reddedilir
    <Directory /home/osman/Desktop/eticaret>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/eticaret.local-error.log
    CustomLog ${APACHE_LOG_DIR}/eticaret.local-access.log combined
</VirtualHost>

# ÜRETİM HTTPS (certbot) -- alan adı ve yolları kendi sunucuna göre uyarla:
#   sudo apt install certbot python3-certbot-apache
#   sudo certbot --apache -d ornek.com -d www.ornek.com
#   (certbot aşağıdaki 443 bloğunu otomatik üretir; elle kurulum için örnek:)
#
# <VirtualHost *:443>
#     ServerName ornek.com
#     DocumentRoot /var/www/eticaret/public
#
#     SSLEngine on
#     SSLCertificateFile    /etc/letsencrypt/live/ornek.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/ornek.com/privkey.pem
#
#     <Directory /var/www/eticaret/public>
#         Options -Indexes +FollowSymLinks
#         AllowOverride All
#         Require all granted
#     </Directory>
#
#     ErrorLog ${APACHE_LOG_DIR}/ornek-error.log
#     CustomLog ${APACHE_LOG_DIR}/ornek-access.log combined
# </VirtualHost>
#
# Sonra public/.htaccess içindeki HTTPS yönlendirme bloğunu aç, .env'de APP_ENV=production yap.